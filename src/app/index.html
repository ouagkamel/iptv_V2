<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lecteur IPTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="ui/main.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #101010; overflow: hidden; }
  #root { height: 100%; }
</style>
</head>
<body>
  <div id="root"></div>
  <!--
    `profils.js` vient **avant** l'interface : il installe `window.iptvProfils`, que l'application
    lit au démarrage pour préremplir le profil Xtream. Le profil versionné est le preset de test
    par défaut en 0.1.18; les essais locaux peuvent le remplacer par `secrets.local/profils.js`, et
    `IPTV_SANS_SOURCES=1` l'efface pour une livraison publiable. `ui/main.js` embarque le pont LS2.
  -->
  <script src="profils.js"></script>
  <script src="ui/main.js"></script>
</body>
</html>
