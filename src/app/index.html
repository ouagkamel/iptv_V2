<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lecteur IPTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="ui/main.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #101010; overflow: hidden; }
  #root { height: 100%; }
</style>
</head>
<body>
  <div id="root"></div>
  <!--
    `profils.js` vient **avant** l'interface : il installe `window.iptvProfils`, que l'application
    lit au démarrage pour préremplir le profil Xtream. A l'empaquetage, ce fichier est remplacé par
    `secrets.local/profils.js` quand il existe (hors dépôt) ; la version du dépôt ne contient aucune
    source. `ui/main.js` embarque le pont LS2 et tous les écrans : aucun autre fichier n'est chargé.
  -->
  <script src="profils.js"></script>
  <script src="ui/main.js"></script>
</body>
</html>
