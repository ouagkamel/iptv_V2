name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-et-tests:
    name: Outillage, compilation et tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:deps
      - run: npm run build:service
      # L'interface Enact a ses propres dependances (react, @enact/*) et sa propre chaine de build.
      # Elle est construite AVANT les tests : `tests/render.test.js` execute le bundle reel dans un
      # DOM headless et verifie qu'il demarre sans requete (regression de l'ecran noir, D-35).
      - name: Dependances de l interface
        run: npm --prefix ui ci
      - name: Construction de l interface (Enact + Sandstone)
        run: npm run build:ui
      - name: Le bundle de l interface est complet
        run: |
          test -s ui/dist/main.js
          test -s ui/dist/main.css
      - run: npm test
      - run: npm run lint:node812
      - name: Publier le service compile pour la cible Node 8.12
        uses: actions/upload-artifact@v4
        with:
          name: service-lib
          path: service/com.ouagkamel.app.iptvplayer.service/lib

  cible-node-8-12:
    name: Tests sur la cible Node 8.12 (service empaquete)
    needs: build-et-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: service-lib
          path: service/com.ouagkamel.app.iptvplayer.service/lib
      - uses: actions/setup-node@v4
        with:
          node-version: '8.12.0'
      - name: Version effectivement testee
        run: node --version
      - name: Controle d'API interdites (source + artefact)
        run: node tools/node812-compat.js
      - name: Tests
        run: node tests/run.js
